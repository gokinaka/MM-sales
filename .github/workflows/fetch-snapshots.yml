name: fetch-snapshots

# 毎日 03:00 JST。スケジュール実行はデフォルトブランチでのみ動く点に注意。
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-snapshots
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # JS 描画のサイト向け。ブラウザ本体はキャッシュして毎回落とさない。
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      - run: python -m playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - run: python -m playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # runner_blocked の店舗は GitHub の IP から到達できないので除外する。
      # それらは週次の抽出タスク側が --mode=blocked で取得する。
      - run: python scripts/fetch_snapshots.py --mode=runner

      - name: Commit changed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git commit -m "chore: update shop snapshots ($(date -u +%Y-%m-%d))"
          git push
