  # いずれも JavaScript 描画のため、ヘッドレスブラウザを導入しない限り取れない。
  #
  # なお MARK IS 館のニュースAPI(event_list.php)も全343記事/70店舗を走査したが、
  # 上記ブランドの記事は 0 件だった。館経由では代替できない。

  - id: patagonia-kannai
