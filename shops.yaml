      - id: top
        url: https://www.helly-hansen.jp/
        url_status: unverified

  - id: keen-garage-yokohama
    name: KEEN GARAGE 横浜(MARK IS 1F)
    area: みなとみらい
    enabled: false
    pages:
      - id: store
        url: https://www.keenfootwear.jp/pages/keen-garages/keen-garage-yokohama
        url_status: confirmed

  # --- 以下は店舗の実在・URLとも未確認。初回実行の結果を見て採否を決める ---

